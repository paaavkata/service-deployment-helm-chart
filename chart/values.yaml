## Top-level values for the shared service-deployment chart.
##
## Consumed as a subchart aliased `parent`; a service sets these under a
## `parent:` block in its own helm/values.yaml. Defaults below are subchart defaults.
##
## HARDENING DEFAULTS (1.3.0): probes and securityContext are ON by default —
## every service serves /startupz /livez /readyz on the metrics port via
## go-server, and the cluster enforces PodSecurity. A service that cannot
## satisfy them yet opts OUT explicitly.
##
## AVAILABILITY DEFAULTS (1.4.0): podDisruptionBudget and topologySpread are
## `auto` — rendered whenever the workload has >= 2 replicas (deployment.replicas,
## or autoscaling.minReplicas when HPA is on), suppressed at 1 replica so a
## singleton never blocks drains. Tolerations default to the 60s fast-failover
## pair. HPA/ServiceMonitor stay opt-in.

environment: dev
host: file-convert.online
enableServiceLinks: false

image:
  registry: registry.internal.stacktixs.com
  app: platform
  service: example-service
  tag: latest
  pullPolicy: Always
  pullSecret: ""

serviceAccount:
  create: false
  namespace: ""

# If set, the Deployment references this existing ServiceAccount (e.g. from a separate RBAC chart)
serviceAccountName: ""

# --- ports ---
container:
  port: 8080          # business API (APP_PORT)
  metricsPort: 9090   # observability (METRICS_PORT) — health + /metrics, NOT via ingress
  host: 127.0.0.1

service:
  port: 80
  type: ClusterIP

# --- availability ---
deployment:
  replicas: 2

# PriorityClass (1.5.0): `auto` renders `services-<environment>` for prod/dev
# (classes live in infra-gitops infra/priority-classes/services.yaml: prod
# preempts dev on the shared services pool, dev never preempts). A literal
# string is rendered as given; "" renders no priorityClassName.
priorityClassName: auto

ingress:
  enabled: true
  path: /api/example
  stripPrefix: true
  mainHostRecord: true
  gatewayPluginEnabled: false
  # Namespace of the traefik-gateway-plugin Middleware CRD (empty = same namespace).
  gatewayPluginNamespace: ""

# --- probes (default ON — go-server serves these on the metrics port) ---
probes:
  enabled: true
  port: metrics                  # named container port the probes target (9090)
  startup:
    path: /startupz
    periodSeconds: 5
    failureThreshold: 30         # up to ~150s for slow migrations
  liveness:
    path: /livez
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    path: /readyz
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

# --- graceful shutdown ---
terminationGracePeriodSeconds: 30
lifecycle:
  # preStopMode: none | nativeSleep
  #   none        -> no preStop; draining handled in-process by go-server ReadinessDrainWait
  #                  (correct for FROM scratch images: no shell/sleep binary to exec)
  #   nativeSleep -> emit the binary-free native `sleep` action (requires k8s >= 1.30)
  preStopMode: none
  preStopSleepSeconds: 5

# --- securityContext (gated) ---
securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
  dropAllCapabilities: true
writableTmp: true                # mount an emptyDir at /tmp when readOnlyRootFilesystem is on

# --- resources: requests always; memory limit; NO cpu limit (anti-throttle) ---
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 128Mi                # cpu intentionally omitted

# --- PodDisruptionBudget: auto | true | false ---
#   auto  -> rendered when replicas >= 2 (never for a singleton: a minAvailable: 1
#            PDB on 1 replica blocks node drains and the descheduler forever)
#   true  -> always rendered; false -> never
podDisruptionBudget:
  enabled: auto
  minAvailable: 1

# --- HorizontalPodAutoscaler (gated). When enabled, the Deployment omits replicas. ---
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

# --- tolerations: fast failover off dead nodes (default). Pods leave an
# unreachable / not-ready node after 60s instead of the k8s-injected 300s.
# A service-supplied list REPLACES this one; an explicit empty list `[]`
# restores the k8s 300s defaults. ---
tolerations:
  - key: node.kubernetes.io/unreachable
    operator: Exists
    effect: NoExecute
    tolerationSeconds: 60
  - key: node.kubernetes.io/not-ready
    operator: Exists
    effect: NoExecute
    tolerationSeconds: 60

# --- topology spread: auto | true | false (auto = when replicas >= 2) ---
topologySpread:
  enabled: auto
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

# --- Prometheus Operator scrape (gated) ---
serviceMonitor:
  enabled: false
  interval: 30s
  path: /metrics
  namespaceSelector: {}          # defaults to release namespace
  labels: {}                     # match your Prometheus serviceMonitorSelector

envVars:
  - name: ENV
    value: dev
  - name: HOST
    value: file-convert.online
  - name: EMAIL_SERVICE_URL
    value: http://email-service/send-email

# Platform attribution label (SERVICEMONITOR.md §4). Defaults to the release
# name; override only if the app_id must differ from the k8s release name.
appId: ""
